version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
  - package-ecosystem: nuget
    directory: /desktop
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
  - package-ecosystem: nuget
    directory: /desktop.tests
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
