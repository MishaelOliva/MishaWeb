name: Windows release verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      NUGET_XMLDOC_MODE: skip

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            desktop/packages.lock.json
            desktop.tests/packages.lock.json

      - name: Restore locked dependencies
        shell: pwsh
        run: dotnet restore desktop.tests/MishaWeb.SmokeTests.csproj --locked-mode

      - name: Check vulnerable NuGet packages
        shell: pwsh
        run: |
          $vulnOutput = dotnet list desktop/MishaWeb.csproj package --vulnerable --include-transitive --format json | Out-String
          Write-Host $vulnOutput
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $vulnJson = $vulnOutput | ConvertFrom-Json
          if ($vulnJson.PSObject.Properties.Name -contains 'problems') {
            $errors = @($vulnJson.problems | Where-Object { $_ -and $_.level -eq 'error' })
            if ($errors.Count -gt 0) {
              throw ('NuGet vulnerability check reported errors: ' + (($errors | ForEach-Object { $_.text }) -join '; '))
            }
          }
          $vulnerable = @()
          foreach ($project in @($vulnJson.projects)) {
            if ($null -eq $project -or -not ($project.PSObject.Properties.Name -contains 'frameworks')) { continue }
            foreach ($framework in @($project.frameworks)) {
              foreach ($listName in @('topLevelPackages', 'transitivePackages')) {
                if (-not ($framework.PSObject.Properties.Name -contains $listName)) { continue }
                foreach ($pkg in @($framework.$listName)) {
                  if ($pkg -and ($pkg.PSObject.Properties.Name -contains 'vulnerabilities') -and @($pkg.vulnerabilities).Count -gt 0) {
                    $vulnerable += "$($pkg.id) $($pkg.resolvedVersion)"
                  }
                }
              }
            }
          }
          if ($vulnerable.Count -gt 0) {
            throw ('Vulnerable NuGet packages detected: ' + ($vulnerable -join ', '))
          }

      - name: Strict build
        shell: pwsh
        run: dotnet build desktop.tests/MishaWeb.SmokeTests.csproj -c Release --no-restore --warnaserror -p:ContinuousIntegrationBuild=true

      - name: Smoke and policy tests
        shell: pwsh
        run: dotnet run --project desktop.tests/MishaWeb.SmokeTests.csproj -c Release --no-build --no-restore

      - name: Set up pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Node contract and script tests
        shell: pwsh
        run: npm run desktop:test:node

      - name: Publish and installer script checks
        shell: powershell
        run: |
          & .\desktop.tests\PublishTransactionSmoke.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.\build\Install-MishaWeb.ps1').Path,
            [ref]$tokens,
            [ref]$errors)
          if ($errors.Count -ne 0) {
            throw ("Install-MishaWeb.ps1 has PowerShell syntax errors: " + ($errors -join '; '))
          }

      - name: Publish clean framework-dependent release
        shell: powershell
        run: .\build\Publish-MishaWeb.ps1 -Mode FrameworkDependent -SkipChecks

      - name: Revalidate framework-dependent release
        shell: powershell
        run: .\build\Publish-MishaWeb.ps1 -Mode FrameworkDependent -ValidateOnly

      - name: Publish clean self-contained release
        shell: powershell
        run: .\build\Publish-MishaWeb.ps1 -Mode Portable -SkipChecks

      - name: Revalidate self-contained release
        shell: powershell
        run: .\build\Publish-MishaWeb.ps1 -Mode Portable -ValidateOnly

      - name: Upload verified release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MishaWeb-windows-x64-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            desktop/publish/**
            desktop/portable/**
